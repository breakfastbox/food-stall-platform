<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1769aa"><link rel="manifest" href="manifest.webmanifest"><title>Apply to Food Stall Platform</title><link rel="stylesheet" href="style.css">
<style>.application-wrap{max-width:650px;margin:24px auto;padding:24px}.plan-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 18px}.plan-choice label{display:block;border:1px solid #d7dee7;border-radius:12px;padding:14px;cursor:pointer;background:#fff}.plan-choice input{margin-right:8px;accent-color:#1769aa}.plan-choice label:has(input:checked){border:2px solid #1769aa;background:#f1f7fd}@media(max-width:520px){.plan-choice{grid-template-columns:1fr}}</style></head>
<body><main class="login-box application-wrap"><h1>Food Stall Platform</h1><h2>Stall Owner Registration</h2>
<p>Complete this form to request a stall account. The Platform Admin will review your application before your account is created.</p>
<form id="applicationForm">
<div class="form-field"><label for="stall_name">Stall name *</label><input id="stall_name" maxlength="100" required></div>
<div class="form-field"><label for="owner_name">Owner full name *</label><input id="owner_name" maxlength="100" required></div>
<div class="form-field"><label for="email">Email address (login) *</label><input id="email" type="email" maxlength="254" required></div>
<div class="form-field"><label for="phone">WhatsApp phone number *</label><input id="phone" type="tel" maxlength="20" required placeholder="Include country code, e.g. +91"></div>
<div class="form-field"><label for="address">Stall address / area</label><input id="address" maxlength="250"></div>
<div class="form-field"><label>Choose the account you are requesting *</label><div class="plan-choice">
<label><input type="radio" name="selected_plan" value="trial" required><strong>7-Day Free Trial</strong><br><small>Try the main stall features for 7 days after approval.</small></label>
<label><input type="radio" name="selected_plan" value="paid" required><strong>Active Paid Account</strong><br><small>₹499/month. Activation follows admin approval and payment verification.</small></label>
</div></div>
<div class="form-field"><label for="upi_payment_mode">Preferred UPI payment setup</label><select id="upi_payment_mode"><option value="dynamic">App-generated QR (exact order amount)</option><option value="bank_qr">My bank's official merchant QR</option></select><small>You can change this later from your stall dashboard. If you choose bank QR, upload it after approval.</small></div>
<div style="position:absolute;left:-10000px" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div>
<button class="button-primary" id="submitApplication" type="submit">Submit Registration Request</button><p id="applicationMessage" role="status" aria-live="polite"></p>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=window.supabase.createClient("https://anlgfcltudysjnsipsmd.supabase.co","sb_publishable_x6V-O5rj20gGsoJSlbTsBw_kVuICTBv");
document.getElementById("applicationForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submitApplication"),msg=document.getElementById("applicationMessage");const selected_plan=document.querySelector('input[name="selected_plan"]:checked')?.value;if(!selected_plan){msg.textContent="Please select Trial or Active Paid Account.";return;}
const body={stall_name:document.getElementById("stall_name").value.trim(),owner_name:document.getElementById("owner_name").value.trim(),email:document.getElementById("email").value.trim(),phone:document.getElementById("phone").value.trim(),address:document.getElementById("address").value.trim(),selected_plan,upi_payment_mode:document.getElementById("upi_payment_mode").value,website:document.getElementById("website").value};
btn.disabled=true;msg.textContent="Submitting your registration request...";try{const {data,error}=await client.functions.invoke("submit-stall-application",{body});if(error)throw new Error(data?.error||error.message);msg.textContent="Your registration request has been submitted. The Platform Admin will review it. If approved, your selected Trial or Paid plan will be processed.";document.getElementById("applicationForm").reset();}catch(err){msg.textContent="Unable to submit: "+err.message;}finally{btn.disabled=false;}});
</script></body></html>
