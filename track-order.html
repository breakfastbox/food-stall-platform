
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Order Status | Breakfast Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: 40px auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #247a43;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #247a43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Breakfast Box</h1>
    <p style="text-align: center;">Check the status of your order</p>

    <form id="trackOrderForm">
      <label for="token">Enter your order token</label>
      <input
        id="token"
        name="token"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="e.g. 741392"
        required
      >

<label for="phone">Your order phone number</label>
<input
  id="phone"
  name="phone"
  type="tel"
  inputmode="tel"
  maxlength="15"
  placeholder="Mobile number used for your order"
  required
>

      <button type="submit">Check Order Status</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://anlgfcltudysjnsipsmd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_x6V-O5rj20gGsoJSlbTsBw_kVuICTBv";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    document
      .getElementById("trackOrderForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const token = document.getElementById("token").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const message = document.getElementById("message");
        const button = this.querySelector('button[type="submit"]');

        message.textContent = "";
        button.disabled = true;
        button.textContent = "Checking...";

        try {
          const { data, error } = await supabaseClient.functions.invoke(
            "check-order-status",
            {
              body: { token, phone }
            }
          );

          if (error || !data) {
            throw new Error("Unable to check status. Please try again.");
          }

          if (data.error) {
            message.textContent = data.error;
            return;
          }

          if (!data.order) {
            message.textContent = "No matching order was found.";
            return;
          }

          const order = data.order;
          const result = document.createElement("div");
          result.style.marginTop = "16px";

          const heading = document.createElement("strong");
          heading.textContent = "Order found!";
          result.appendChild(heading);

          const details = [
            "Token: " + order.token_number,
            "Order status: " + order.order_status,
            "Payment status: " + order.payment_status,
            "Total: ₹" + Number(order.total_amount).toFixed(2)
          ];

          details.forEach(function (detail) {
            const line = document.createElement("p");
            line.textContent = detail;
            result.appendChild(line);
          });

          message.replaceChildren(result);
        } catch (error) {
          console.error("Status check failed:", error);
          message.textContent =
            "Unable to check status right now. Please try again.";
        } finally {
          button.disabled = false;
          button.textContent = "Check Order Status";
        }
      });
  </script>

</body>
</html>
