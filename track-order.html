
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Order Status | Breakfast Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: 40px auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #247a43;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #247a43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Breakfast Box</h1>
    <p style="text-align: center;">Check the status of your order</p>

    <form id="trackOrderForm">
      <label for="token">Enter your order token</label>
      <input
        id="token"
        name="token"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="e.g. 741392"
        required
      >

<label for="phone">Your order phone number</label>
<input
  id="phone"
  name="phone"
  type="tel"
  inputmode="tel"
  maxlength="15"
  placeholder="Mobile number used for your order"
  required
>

      <button type="submit">Check Order Status</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://anlgfcltudysjnsipsmd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_x6V-O5rj20gGsoJSlbTsBw_kVuICTBv";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let statusRefreshTimer = null;
let statusCheckInProgress = false;

const message = document.getElementById("message");
const trackingForm = document.getElementById("trackOrderForm");

function displayOrder(order) {
  const result = document.createElement("div");
  result.style.textAlign = "left";
  result.style.marginTop = "16px";

  const heading = document.createElement("h2");
  heading.textContent =
    "Order Token: " + String(order.token_number ?? "Not assigned")
      .padStart(4, "0");

  result.appendChild(heading);

  const details = [
    "Order status: " + order.order_status,
    "Payment status: " + order.payment_status,
    "Total: ₹" + Number(order.total_amount || 0).toFixed(2)
  ];

  if (order.created_at) {
    details.push(
      "Placed: " + new Date(order.created_at).toLocaleString("en-IN")
    );
  }

  details.forEach(detail => {
    const p = document.createElement("p");
    p.textContent = detail;
    result.appendChild(p);
  });

  const itemsHeading = document.createElement("h3");
  itemsHeading.textContent = "Your Ordered Items";
  result.appendChild(itemsHeading);

  const itemList = document.createElement("ul");

  (order.items || []).forEach(item => {
    const li = document.createElement("li");
    li.textContent =
      item.item_name + " × " + item.quantity;
    itemList.appendChild(li);
  });

  result.appendChild(itemList);

  const footer = document.createElement("p");
  footer.textContent = "Your order status updates automatically.";
  result.appendChild(footer);

  message.replaceChildren(result);
}

async function checkOrderByCode(code) {
  if (statusCheckInProgress) return;

  statusCheckInProgress = true;

  try {
    const { data, error } = await supabaseClient.rpc(
      "get_order_tracking",
      { p_tracking_code: code }
    );

    if (error) throw error;

    if (!data || data.found !== true) {
      message.textContent = "No matching order was found.";
      return;
    }

    displayOrder(data);

  } catch (error) {
    console.error("Tracking failed:", error);
    message.textContent =
      "Unable to check your order. Please try again.";
  } finally {
    statusCheckInProgress = false;
  }
}

// New secure tracking link.
const trackingCode =
  new URLSearchParams(window.location.search).get("code");

if (trackingCode) {
  const uuidPattern =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  if (!uuidPattern.test(trackingCode)) {
    message.textContent = "Invalid tracking link.";
  } else {
    trackingForm.hidden = true;
    message.textContent = "Loading your order...";

    checkOrderByCode(trackingCode);

    statusRefreshTimer = setInterval(() => {
      checkOrderByCode(trackingCode);
    }, 15000);
  }
}

// Legacy tracking using token and phone for older orders.
async function checkOrderStatus(token, phone, button = null) {
  if (statusCheckInProgress) return false;

  statusCheckInProgress = true;

  if (button) {
    button.disabled = true;
    button.textContent = "Checking...";
  }

  try {
    const { data, error } = await supabaseClient.functions.invoke(
      "check-order-status",
      {
        body: { token, phone }
      }
    );

    if (error || !data) {
      throw new Error("Unable to check order status.");
    }

    if (data.error || !data.order) {
      message.textContent =
        data.error || "No matching order was found.";
      return false;
    }

    displayOrder({
      ...data.order,
      items: data.order.items || []
    });

    return true;

  } catch (error) {
    console.error(error);
    message.textContent =
      "Unable to check order status. Please try again.";
    return false;

  } finally {
    statusCheckInProgress = false;

    if (button) {
      button.disabled = false;
      button.textContent = "Check Order Status";
    }
  }
}

trackingForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const token =
    document.getElementById("token").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const button =
    this.querySelector('button[type="submit"]');

  if (statusRefreshTimer) {
    clearInterval(statusRefreshTimer);
    statusRefreshTimer = null;
  }

  const success = await checkOrderStatus(
    token,
    phone,
    button
  );

  if (success) {
    statusRefreshTimer = setInterval(() => {
      checkOrderStatus(token, phone);
    }, 15000);
  }
});
</script>


</body>
</html>
