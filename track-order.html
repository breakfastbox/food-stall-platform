
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Order Status | Breakfast Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: 40px auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #247a43;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #247a43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Breakfast Box</h1>
    <p style="text-align: center;">Check the status of your order</p>

    <form id="trackOrderForm">
      <label for="token">Enter your order token</label>
      <input
        id="token"
        name="token"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="e.g. 741392"
        required
      >

      <button type="submit">Check Order Status</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
