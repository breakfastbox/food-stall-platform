
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Order Status | Breakfast Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: 40px auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #247a43;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #247a43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .change-panel {
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #d9e5dc;
      border-radius: 10px;
      background: #fbfdfb;
    }
    .change-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    .change-row input {
      width: 76px;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    .change-note {
      width: 100%;
      min-height: 70px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font: inherit;
    }
    .change-submit {
      width: 100%;
      background: #247a43;
      color: white;
      font-weight: bold;
    }
    .change-muted { color: #666; font-size: 13px; }
  </style>
</head>

<body>
  <main class="container">
    <h1 id="stallName">Order Tracking</h1>
    <p style="text-align: center;">Check the status of your order</p>

    <form id="trackOrderForm">
      <label for="token">Enter your order token</label>
      <p class="change-muted" style="margin:0 0 8px;">Use the token shown after checkout (for example, 0007).</p>
      <input
        id="token"
        name="token"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{4,6}"
        maxlength="6"
        placeholder="e.g. 0007"
        required
      >

<label for="phone">Your order phone number</label>
<input
  id="phone"
  name="phone"
  type="tel"
  inputmode="tel"
  maxlength="15"
  placeholder="Mobile number used for your order"
  required
>

      <button type="submit">Check Order Status</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://anlgfcltudysjnsipsmd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_x6V-O5rj20gGsoJSlbTsBw_kVuICTBv";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let statusRefreshTimer = null;
let statusCheckInProgress = false;

const message = document.getElementById("message");
const trackingForm = document.getElementById("trackOrderForm");

function displayOrder(order) {
  if (order.stall_name) {
    document.getElementById("stallName").textContent = order.stall_name;
    document.title = order.stall_name + " | Track Order";
  }

  const result = document.createElement("div");
  result.style.textAlign = "left";
  result.style.marginTop = "16px";

  const heading = document.createElement("h2");
  heading.textContent =
    "Order Token: " + String(order.token_number ?? "Not assigned")
      .padStart(4, "0");

  result.appendChild(heading);

  const rawCustomerStatus = String(order.order_status || "pending").toLowerCase();
  const customerStatus = ["preparing", "ready"].includes(rawCustomerStatus) ? "Accepted" : rawCustomerStatus === "completed" ? "Delivered" : rawCustomerStatus.replace(/^./, c => c.toUpperCase());
  const details = [
    "Order status: " + customerStatus,
    "Payment status: " + order.payment_status,
    "Total: ₹" + Number(order.total_amount || 0).toFixed(2)
  ];

  if (order.created_at) {
    details.push(
      "Placed: " + new Date(order.created_at).toLocaleString("en-IN")
    );
  }

  details.forEach(detail => {
    const p = document.createElement("p");
    p.textContent = detail;
    result.appendChild(p);
  });

  const itemsHeading = document.createElement("h3");
  itemsHeading.textContent = "Your Ordered Items";
  result.appendChild(itemsHeading);

  const itemList = document.createElement("ul");

  (order.items || []).forEach(item => {
    const li = document.createElement("li");
    li.textContent =
      item.item_name + " × " + item.quantity;
    itemList.appendChild(li);
  });

  result.appendChild(itemList);

  const footer = document.createElement("p");
  footer.textContent = "Your order status updates automatically.";
  result.appendChild(footer);

  const existingPanel = message.querySelector(".change-panel");
  message.replaceChildren(result);

  if (existingPanel) {
    // Keep the existing form in place while the 15-second status poll refreshes.
    // This prevents customer-entered quantities and notes from being erased.
    result.appendChild(existingPanel);
    const deadline = new Date(order.created_at).getTime() + 5 * 60 * 1000;
    const canChangeBeforePreparation = normalizeCustomerChangeStatus(order.order_status) === "pending";
    const locked = !canChangeBeforePreparation ||
      Boolean(order.stock_deducted_at) || Date.now() >= deadline;

    if (locked) {
      const info = existingPanel.querySelector(".change-muted");
      if (info) {
        info.textContent = !canChangeBeforePreparation
          ? "Changes are locked because the stall has accepted the order or closed it."
          : order.stock_deducted_at
            ? "Changes are locked because the stall has accepted the order."
            : "The 5-minute change window has ended. Please contact the stall for help.";
      }
      existingPanel.querySelectorAll("input, textarea, button").forEach(control => {
        control.disabled = true;
      });
    }
  } else {
    renderOrderChangePanel(order, result);
  }
}

function normalizeCustomerChangeStatus(status) {
  const value = String(status || "pending").toLowerCase();
  return ["preparing", "ready"].includes(value) ? "accepted" : value;
}

const CHANGE_REQUEST_URL = SUPABASE_URL + "/functions/v1/order-change-requests";

async function renderOrderChangePanel(order, parent) {
  if (!order.stall_id || !order.created_at) return;

  const panel = document.createElement("section");
  panel.className = "change-panel";
  const title = document.createElement("h3");
  title.textContent = "Need to change your order?";
  panel.appendChild(title);
  const info = document.createElement("p");
  info.className = "change-muted";
  panel.appendChild(info);
  parent.appendChild(panel);

  const deadline = new Date(order.created_at).getTime() + 5 * 60 * 1000;
  const stillEligible = String(order.order_status || "").toLowerCase() === "pending" &&
    !order.stock_deducted_at && Date.now() < deadline;

  try {
    const statusResponse = await fetch(CHANGE_REQUEST_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY
      },
      body: JSON.stringify({ action: "status", tracking_code: trackingCode })
    });
    const statusData = await statusResponse.json();
    if (!statusResponse.ok) throw new Error(statusData.error || "Could not check change request status.");

    const existing = statusData.request;
    if (existing && existing.request_status === "pending") {
      info.textContent = "Your change request is waiting for the stall to approve it. The original order remains unchanged until approval.";
      return;
    }
    const previousRequestMessage =
      existing && ["approved", "rejected", "expired"].includes(existing.request_status)
        ? "Last change request: " + existing.request_status + ". "
        : "";
    if (!stillEligible) {
      info.textContent = previousRequestMessage + (normalizeCustomerChangeStatus(order.order_status) !== "pending"
        ? "Changes are locked because the stall has accepted the order or closed it."
        : order.stock_deducted_at
          ? "Changes are locked because stock has already been deducted."
          : "The 5-minute change window has ended. Please contact the stall for help.");
      return;
    }

    const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    info.textContent = previousRequestMessage + "You can request changes for " + Math.floor(remaining / 60) +
      ":" + String(remaining % 60).padStart(2, "0") +
      " more. The stall must approve your request.";

    const { data: menu, error } = await supabaseClient
      .from("menu_items")
      .select("id, name, price")
      .eq("stall_id", order.stall_id)
      .eq("is_available", true)
      .order("name");
    if (error) throw error;
    if (!menu || !menu.length) {
      info.textContent += " No menu items are currently available to select.";
      return;
    }

    const quantities = new Map((order.items || []).map(item =>
      [item.menu_item_id, Number(item.quantity)]
    ));
    const fields = document.createElement("div");
    menu.forEach(item => {
      const row = document.createElement("label");
      row.className = "change-row";
      const name = document.createElement("span");
      name.textContent = item.name + " · ₹" + Number(item.price).toFixed(2);
      const input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.max = "20";
      input.step = "1";
      input.value = String(quantities.get(item.id) || 0);
      input.dataset.menuItemId = item.id;
      input.setAttribute("aria-label", "Quantity of " + item.name);
      row.append(name, input);
      fields.appendChild(row);
    });
    panel.appendChild(fields);

    const noteLabel = document.createElement("p");
    noteLabel.textContent = "Note (optional)";
    noteLabel.style.textAlign = "left";
    panel.appendChild(noteLabel);
    const note = document.createElement("textarea");
    note.className = "change-note";
    note.maxLength = 500;
    note.placeholder = "Add a note for the stall";
    panel.appendChild(note);

    const submit = document.createElement("button");
    submit.className = "change-submit";
    submit.textContent = "Send Change Request";
    panel.appendChild(submit);
    const feedback = document.createElement("p");
    feedback.className = "change-muted";
    panel.appendChild(feedback);

    submit.addEventListener("click", async () => {
      const proposedItems = Array.from(fields.querySelectorAll("input[data-menu-item-id]"))
        .map(input => ({
          menu_item_id: input.dataset.menuItemId,
          quantity: Number(input.value)
        }))
        .filter(item => item.quantity > 0);
      if (!proposedItems.length) {
        feedback.textContent = "Please keep at least one item in your order.";
        return;
      }
      if (proposedItems.some(item => !Number.isInteger(item.quantity) || item.quantity > 20)) {
        feedback.textContent = "Each quantity must be between 1 and 20.";
        return;
      }
      submit.disabled = true;
      submit.textContent = "Sending...";
      try {
        const response = await fetch(CHANGE_REQUEST_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY
          },
          body: JSON.stringify({
            action: "submit",
            tracking_code: trackingCode,
            proposed_items: proposedItems,
            customer_note: note.value.trim()
          })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.error || "Could not send your change request.");
        }
        info.textContent = "Your change request has been sent. The original order will remain unchanged until the stall approves it.";
        fields.replaceChildren();
        note.remove();
        noteLabel.remove();
        submit.remove();
        feedback.textContent = "Request sent successfully.";
      } catch (error) {
        feedback.textContent = error.message;
        submit.disabled = false;
        submit.textContent = "Send Change Request";
      }
    });
  } catch (error) {
    console.error("Order change panel failed:", error);
    info.textContent = "Order changes are temporarily unavailable. Please contact the stall.";
  }
}

async function checkOrderByCode(code) {
  if (statusCheckInProgress) return;

  statusCheckInProgress = true;

  try {
    const { data, error } = await supabaseClient.rpc(
      "get_order_tracking",
      { p_tracking_code: code }
    );

    if (error) throw error;

    if (!data || data.found !== true) {
      message.textContent = "No matching order was found.";
      return;
    }

    displayOrder(data);

  } catch (error) {
    console.error("Tracking failed:", error);
    message.textContent =
      "Unable to check your order. Please try again.";
  } finally {
    statusCheckInProgress = false;
  }
}

// New secure tracking link.
const trackingParams = new URLSearchParams(window.location.search);
const trackingCode = trackingParams.get("code");
const requestedStallId = trackingParams.get("stall_id") || "";

if (trackingCode) {
  const uuidPattern =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  if (!uuidPattern.test(trackingCode)) {
    message.textContent = "Invalid tracking link.";
  } else {
    trackingForm.hidden = true;
    message.textContent = "Loading your order...";

    checkOrderByCode(trackingCode);

    statusRefreshTimer = setInterval(() => {
      checkOrderByCode(trackingCode);
    }, 15000);
  }
}

// Legacy tracking using token and phone for older orders.
async function checkOrderStatus(token, phone, button = null) {
  if (statusCheckInProgress) return false;

  statusCheckInProgress = true;

  if (button) {
    button.disabled = true;
    button.textContent = "Checking...";
  }

  try {
    const { data, error } = await supabaseClient.functions.invoke(
      "check-order-status",
      {
        body: { token, phone, stall_id: requestedStallId || undefined }
      }
    );

    if (error || !data) {
      throw new Error("Unable to check order status.");
    }

    if (data.error || !data.order) {
      message.textContent =
        data.error || "No matching order was found.";
      return false;
    }

    displayOrder({
      ...data.order,
      items: data.order.items || []
    });

    return true;

  } catch (error) {
    console.error(error);
    message.textContent =
      "Unable to check order status. Please try again.";
    return false;

  } finally {
    statusCheckInProgress = false;

    if (button) {
      button.disabled = false;
      button.textContent = "Check Order Status";
    }
  }
}

trackingForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const token =
    document.getElementById("token").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const button =
    this.querySelector('button[type="submit"]');

  if (statusRefreshTimer) {
    clearInterval(statusRefreshTimer);
    statusRefreshTimer = null;
  }

  const success = await checkOrderStatus(
    token,
    phone,
    button
  );

  if (success) {
    statusRefreshTimer = setInterval(() => {
      checkOrderStatus(token, phone);
    }, 15000);
  }
});
</script>


</body>
</html>
