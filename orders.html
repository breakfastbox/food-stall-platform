
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Food Stall Platform</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6fa;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button, select {
      padding: 10px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
    }

    .status {
      font-weight: bold;
    }

    .muted {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 Order Management</h1>
    <p class="muted">Breakfast Box — manage customer orders</p>

    <button onclick="loadOrders()">Refresh Orders</button>
    <button onclick="window.location.href='stall.html'">Back to Dashboard</button>

    <p id="ordersMessage" class="muted">Loading orders...</p>
    <div id="ordersList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    loadOrders();
  </script>
</body>
</html>
