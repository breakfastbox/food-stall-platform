<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Stall Platform - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-box" id="loginBox">

    <h1>Food Stall Platform</h1>
    <h2>Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="loginAdmin()">Login</button>

    <p id="loginMessage"></p>

  </div>


  <div class="dashboard" id="dashboard" style="display: none;">

    <header class="topbar">
      <div>
        <h1>Food Stall Platform</h1>
        <p>Admin Dashboard</p>
      </div>

      <button onclick="logoutAdmin()">Logout</button>
    </header>

    <main>

      <section class="welcome">
        <h2>Welcome, Admin 👋</h2>
        <p>Manage your food stalls, subscriptions and orders from here.</p>
      </section>

      <section class="stats">

        <div class="card">
          <h3>Total Stalls</h3>
          <strong id="totalStalls">0</strong>
        </div>

        <div class="card">
          <h3>Active Stalls</h3>
          <strong id="activeStalls">0</strong>
        </div>

        <div class="card">
          <h3>Trial Stalls</h3>
          <strong id="trialStalls">0</strong>
        </div>

        <div class="card">
          <h3>Suspended</h3>
          <strong id="suspendedStalls">0</strong>
        </div>

      </section>

      <section class="panel">

        <div class="panel-header">
          <h2>Food Stalls</h2>
          <button onclick="loadStalls()">Refresh</button>
        </div>

        <div id="stallList">
  Loading stalls...
</div>

<div id="stallMessage"></div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

</body>
</html>
