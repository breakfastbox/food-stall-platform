
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Order History - Breakfast Box</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      margin: 0;
      padding: 20px;
      color: #26352c;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #176b45;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .items {
      padding-left: 20px;
      line-height: 1.8;
    }

    .status {
      font-weight: bold;
      color: #176b45;
    }

    .button {
      display: inline-block;
      padding: 11px 17px;
      margin-top: 10px;
      background: #176b45;
      color: white;
      border-radius: 7px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .secondary {
      background: #52645a;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      background: white;
      border-radius: 12px;
    }

    #historyMessage {
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>📦 My Order History</h1>
    <p style="text-align:center">
      Breakfast Box — Your previous orders
    </p>

    <p id="historyMessage">Loading your orders...</p>

    <div id="historyList"></div>

    <div style="text-align:center">
      <a class="button secondary" href="order.html">
        Order Breakfast
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://anlgfcltudysjnsipsmd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_x6V-O5rj20gGsoJSlbTsBw_kVuICTBv";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const HISTORY_KEY = "breakfastBoxOrderHistory";

    const historyList = document.getElementById("historyList");
    const historyMessage = document.getElementById("historyMessage");

    let historyLoading = false;

    function createTextElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;

      if (className) element.className = className;

      return element;
    }

    async function loadOrderHistory() {
      if (historyLoading) return;

      historyLoading = true;

      try {
        let savedOrders;

        try {
          savedOrders = JSON.parse(
            localStorage.getItem(HISTORY_KEY) || "[]"
          );
        } catch {
          savedOrders = [];
        }

        if (!Array.isArray(savedOrders) || savedOrders.length === 0) {
          historyMessage.textContent =
            "No previous orders found on this device.";

          historyList.replaceChildren(
            createTextElement(
              "div",
              "Your orders will appear here after checkout.",
              "empty"
            )
          );

          return;
        }

        historyMessage.textContent = "Loading previous orders...";

        const results = await Promise.all(
          savedOrders.slice(0, 20).map(async saved => {
            try {
              const { data, error } = await client.rpc(
                "get_order_tracking",
                {
                  p_tracking_code: saved.tracking_code
                }
              );

              if (error) throw error;

              return {
                saved,
                order: data?.found ? data : null
              };

            } catch (error) {
              console.error("History lookup failed:", error);
              return { saved, order: null, failed: true };
            }
          })
        );

        const cards = [];

        for (const { saved, order, failed } of results) {
          const card = document.createElement("div");
          card.className = "card";

          if (!order) {
            card.appendChild(
              createTextElement(
                "p",
                failed
                  ? "Unable to load this order. Please try again."
                  : "This order could not be found."
              )
            );
          } else {
            const token = order.token_number == null
              ? "Not assigned"
              : String(order.token_number).padStart(4, "0");

            card.appendChild(
              createTextElement("h2", "Order #" + token)
            );

            const date = order.created_at
              ? new Date(order.created_at).toLocaleString("en-IN")
              : "Date unavailable";

            card.appendChild(
              createTextElement("p", "Placed: " + date)
            );

            card.appendChild(
              createTextElement(
                "p",
                "Order Status: " + order.order_status,
                "status"
              )
            );

            card.appendChild(
              createTextElement(
                "p",
                "Payment Status: " + order.payment_status
              )
            );

            card.appendChild(
              createTextElement(
                "p",
                "Total: ₹" + Number(order.total_amount || 0).toFixed(2)
              )
            );

            card.appendChild(
              createTextElement("h3", "Food Items")
            );

            const itemList = document.createElement("ul");
            itemList.className = "items";

            (order.items || []).forEach(item => {
              itemList.appendChild(
                createTextElement(
                  "li",
                  item.item_name + " × " + item.quantity
                )
              );
            });


            card.appendChild(itemList);

            // Show the latest change-request decision using the private order tracking code.
            try {
              const statusResponse = await fetch(SUPABASE_URL + "/functions/v1/order-change-requests", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "apikey": SUPABASE_PUBLISHABLE_KEY
                },
                body: JSON.stringify({
                  action: "status",
                  tracking_code: saved.tracking_code
                })
              });
              const statusResult = await statusResponse.json();
              if (statusResponse.ok && statusResult.request) {
                const request = statusResult.request;
                const statusLabels = {
                  pending: "Your change request is waiting for the stall's approval.",
                  approved: "Your change request was approved. Your order details are updated below.",
                  rejected: "Your change request was declined. Your original order remains unchanged.",
                  expired: "Your change request expired. Your original order remains unchanged."
                };
                const statusBox = document.createElement("div");
                statusBox.style.cssText = "margin-top:14px;padding:12px;border:1px solid #d7e5dc;border-radius:9px;background:#f8fcf9;";
                statusBox.appendChild(createTextElement("strong", "Change Request: " + request.request_status.toUpperCase()));
                statusBox.appendChild(createTextElement("p", statusLabels[request.request_status] || "Your change request has been updated."));
                statusBox.appendChild(createTextElement("p", "Requested total: ₹" + Number(request.proposed_total || 0).toFixed(2)));
                card.appendChild(statusBox);
              }
            } catch (statusError) {
              console.error("Change request status lookup failed:", statusError);
            }

            const changeDeadline = new Date(order.created_at).getTime() + 5 * 60 * 1000;
            if (order.order_status === "pending" && Date.now() < changeDeadline) {
              const changeBox = document.createElement("div");
              changeBox.style.cssText = "margin-top:16px;padding:14px;border:1px solid #d7e5dc;border-radius:9px;background:#f8fcf9;";
              changeBox.appendChild(createTextElement("h3", "Request an Order Change"));
              changeBox.appendChild(createTextElement("p", "Adjust quantities below. The stall must approve your request."));
              const quantityInputs = [];

              (order.items || []).forEach(item => {
                if (!item.menu_item_id) return;
                const line = document.createElement("label");
                line.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:12px;margin:9px 0;";
                line.appendChild(createTextElement("span", item.item_name));
                const quantity = document.createElement("input");
                quantity.type = "number";
                quantity.min = "0";
                quantity.max = "20";
                quantity.step = "1";
                quantity.value = String(item.quantity);
                quantity.style.width = "72px";
                quantity.setAttribute("aria-label", "New quantity for " + item.item_name);
                line.appendChild(quantity);
                changeBox.appendChild(line);
                quantityInputs.push({ menu_item_id: item.menu_item_id, input: quantity });
              });

              const note = document.createElement("textarea");
              note.maxLength = 500;
              note.placeholder = "Optional note for the stall";
              note.style.cssText = "width:100%;box-sizing:border-box;min-height:55px;margin-top:8px;";
              changeBox.appendChild(note);

              const send = document.createElement("button");
              send.className = "button";
              send.textContent = "Send Change Request";
              send.addEventListener("click", async () => {
                const proposedItems = [];
                for (const entry of quantityInputs) {
                  const quantity = Number(entry.input.value);
                  if (!Number.isInteger(quantity) || quantity < 0 || quantity > 20) {
                    alert("Enter a quantity between 0 and 20.");
                    return;
                  }
                  if (quantity > 0) proposedItems.push({ menu_item_id: entry.menu_item_id, quantity });
                }
                if (!proposedItems.length) {
                  alert("Your revised order must contain at least one item.");
                  return;
                }
                send.disabled = true;
                send.textContent = "Sending...";
                try {
                  const response = await fetch(SUPABASE_URL + "/functions/v1/order-change-requests", {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "apikey": SUPABASE_PUBLISHABLE_KEY
                    },
                    body: JSON.stringify({
                      action: "submit",
                      tracking_code: saved.tracking_code,
                      proposed_items: proposedItems,
                      customer_note: note.value
                    })
                  });
                  const result = await response.json();
                  if (!response.ok) throw new Error(result.error || "Could not send the request.");
                  send.textContent = "Request Sent";
                  send.disabled = true;
                  alert("Your change request has been sent to the stall for approval.");
                } catch (error) {
                  alert(error.message);
                  send.disabled = false;
                  send.textContent = "Send Change Request";
                }
              });
              changeBox.appendChild(send);
              card.appendChild(changeBox);
            }
          }

          const trackLink = document.createElement("a");

          trackLink.className = "button";
          trackLink.textContent = "Track This Order";
          trackLink.href =
            "track-order.html?code=" +
            encodeURIComponent(saved.tracking_code);

          card.appendChild(trackLink);

          cards.push(card);
        }

        historyList.replaceChildren(...cards);

        historyMessage.textContent =
          results.length + " saved order(s) found.";

      } catch (error) {
        console.error("Order history loading failed:", error);
        historyMessage.textContent = "Unable to load your orders. Please refresh this page and try again.";
      } finally {
        historyLoading = false;
      }
    }

    loadOrderHistory();

    setInterval(() => {
      if (!document.hidden) {
        loadOrderHistory();
      }
    }, 30000);
  </script>

</body>
</html>
